<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hayabee29 - 年別ログ</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --primary-blue: #0078d4; --light-blue: #e1f5fe; --text-dark: #333; --bg-gray: #f9f9f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0 0 60px 0; background: var(--bg-gray); color: var(--text-dark); }
        header { background: linear-gradient(135deg, #0078d4, #00b0ff); color: white; padding: 25px 10px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 12px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 18px; margin-bottom: 16px; }
        .year-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light-blue); padding-bottom: 8px; margin-bottom: 12px; }
        .year-title { font-size: 20px; font-weight: bold; color: var(--primary-blue); }
        .year-content { font-size: 14px; line-height: 1.6; color: #444; white-space: pre-wrap; word-break: break-all; min-height: 24px; }
        .empty-text { color: #aaa; font-style: italic; }
        h2 { border-left: 5px solid var(--primary-blue); padding-left: 12px; color: var(--primary-blue); margin-top: 0; margin-bottom: 16px; font-size: 18px; }
        input[type="password"], select, textarea { width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; margin-top: 8px; }
        .btn-blue { background: var(--primary-blue); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; font-size: 14px; }
        .btn-green { background: #4caf50; }
        .btn-gray { background: #888; }
        .auth-area { background: #f0f7ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>hayabee29</h1>
    </header>

    <div class="container">
        
        <!-- 2020年からの年一覧表示エリア -->
        <div id="years-list-container">
            <!-- JavaScriptで2020年〜のカードを動的に生成します -->
        </div>

        <!-- 設定・編集エリア -->
        <div class="card" id="settings-section">
            <h2>⚙️ 年別の内容編集・設定</h2>
            
            <div class="auth-area">
                <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px;">🔒 パスワード認証</label>
                <div style="display: flex; gap: 8px;">
                    <input type="password" id="settings-password" placeholder="パスワードを入力">
                    <button class="btn-blue" style="margin-top: 0; width: 90px;" onclick="verifyPassword()">認証</button>
                </div>
            </div>

            <div id="editor-area" style="opacity: 0.4; pointer-events: none; transition: 0.3s;">
                <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px;">📅 編集する年を選択</label>
                <select id="target-year-select" onchange="loadSelectedYearContent()"></select>

                <label style="font-size: 13px; font-weight: bold; display: block; margin-top: 12px; margin-bottom: 4px;">📝 内容を入力</label>
                <textarea id="year-content-input" placeholder="この年の内容や予定を入力してください..."></textarea>

                <button class="btn-blue" onclick="saveSelectedYearContent()">選択した年の内容を保存</button>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <button class="btn-blue btn-green" onclick="syncSaveAll()">クラウドへ保存 (送信)</button>
            <button class="btn-blue" style="background:#0288d1;" onclick="syncLoadAll()">クラウドから読込 (受信)</button>
            <button class="btn-blue btn-gray" onclick="if(confirm('初期化しますか？')){localStorage.clear(); location.reload();}">データ全初期化</button>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxBxVnIGXV8VPExeVmcSRSw-0fDUVtBztFZDeH4MMpLDITsXpJ3J15ZuPIKSWwWmUOM/exec";
        const ADMIN_PASSWORD = "hayabee29";
        
        const START_YEAR = 2020;
        const END_YEAR = 2035;
        let yearData = {};

        // ローカルストレージからデータをロード
        function loadLocalData() {
            for (let y = START_YEAR; y <= END_YEAR; y++) {
                yearData[y] = localStorage.getItem(`year_text_${y}`) || "";
            }
        }

        // 年別リストの描画
        function renderYearsList() {
            const container = document.getElementById('years-list-container');
            container.innerHTML = "";

            for (let y = START_YEAR; y <= END_YEAR; y++) {
                const content = yearData[y] || "";
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-year-${y}`;
                
                card.innerHTML = `
                    <div class="year-card-header">
                        <span class="year-title">${y}年</span>
                    </div>
                    <div class="year-content">${content ? escapeHtml(content) : '<span class="empty-text">内容はありません</span>'}</div>
                `;
                container.appendChild(card);
            }
        }

        // 年選択ドロップダウンの初期化
        function initYearSelect() {
            const select = document.getElementById('target-year-select');
            select.innerHTML = "";
            const currentYear = new Date().getFullYear();

            for (let y = START_YEAR; y <= END_YEAR; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}年`;
                if (y === currentYear) opt.selected = true;
                select.appendChild(opt);
            }
            loadSelectedYearContent();
        }

        // パスワード認証
        function verifyPassword() {
            const pass = document.getElementById('settings-password').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('editor-area').style.opacity = '1';
                document.getElementById('editor-area').style.pointerEvents = 'auto';
                alert("認証成功！編集が可能になりました。");
            } else {
                alert("パスワードが違います。");
            }
        }

        // 選択された年の内容を入力エリアにセット
        function loadSelectedYearContent() {
            const y = document.getElementById('target-year-select').value;
            document.getElementById('year-content-input').value = yearData[y] || "";
        }

        // 選択された年の内容を保存
        function saveSelectedYearContent() {
            const y = document.getElementById('target-year-select').value;
            const text = document.getElementById('year-content-input').value;

            yearData[y] = text;
            localStorage.setItem(`year_text_${y}`, text);
            renderYearsList();

            // 該当する年のカードへスムーズスクロール
            document.getElementById(`card-year-${y}`).scrollIntoView({ behavior: 'smooth' });
            alert(`${y}年の内容を保存しました！`);
        }

        // クラウドへ一括送信
        async function syncSaveAll() {
            try {
                await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ yearData: yearData }) 
                });
                alert("全年のデータをクラウドに保存しました！");
            } catch (e) { 
                alert("クラウド保存に失敗しました。"); 
            }
        }

        // クラウドから一括受信
        async function syncLoadAll() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.yearData) {
                    yearData = data.yearData;
                    for (let y in yearData) {
                        localStorage.setItem(`year_text_${y}`, yearData[y]);
                    }
                    renderYearsList();
                    loadSelectedYearContent();
                    alert("クラウドから最新データを読み込みました！");
                }
            } catch (e) { 
                alert("クラウドからの読込に失敗しました。"); 
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        window.onload = () => {
            loadLocalData();
            renderYearsList();
            initYearSelect();
        };
    </script>
</body>
</html>
